openapi: 3.0.3
info:
  title: CommunityOS API - Water Delivery MVP
  version: 1.0.0
  description: API surface for the CommunityOS water-delivery MVP (auth, orders, providers, timeline)
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/orders:
    post:
      summary: Create a new order (resident)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    get:
      summary: List orders for current tenant/user (paged)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer
  /api/orders/{orderId}:
    get:
      summary: Get order by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /api/orders/{orderId}/timeline:
    get:
      summary: Get sync timeline for an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
  /api/providers/{providerId}/orders/{orderId}/accept:
    post:
      summary: Provider accepts an order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName, tenantId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        fullName:
          type: string
        phone:
          type: string
        tenantId:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
    CreateOrderRequest:
      type: object
      required: [tenantId, communityId, items]
      properties:
        tenantId:
          type: string
        communityId:
          type: string
        providerId:
          type: string
        items:
          type: array
          items:
            type: object
            required: [serviceId, quantity]
            properties:
              serviceId:
                type: string
              quantity:
                type: integer
    Order:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        communityId:
          type: string
        residentId:
          type: string
        providerId:
          type: string
        status:
          type: string
        total:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdAt:
          type: string
          format: date-time
    OrderItem:
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        total:
          type: number
    Event:
      type: object
      properties:
        id:
          type: string
        eventName:
          type: string
        aggregateType:
          type: string
        aggregateId:
          type: string
        payload:
          type: object
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
